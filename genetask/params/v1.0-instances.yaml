# 参数轮换实例表（W3，2026-09-10）
#
# **这张表不是第二份题库**：它只说「拿出集的 40 行参数、沿哪几个维度换取值」。
# 题面仍由 `genetask/render.py::render_arm` + 现有 `genetask/phrasebook.yaml` 渲染，
# 生成器 `ops/mk_instances.py` 一行渲染逻辑都不新写 —— 这是「槽位机器生成不重签」的全部内容。
#
# **不许往 phrasebook 加新措辞**：加了就动了冻结根（`ops/freeze_v10.py::CODE_FILES`）、
# 40 道出集题要重签。所以凡是会落进 `declared` 的取值，都必须在 phrasebook 里**已经有**
# strict/open 两列措辞；没有的一律不许当实例参数，生成器当场拒并报出是哪个取值缺措辞。
# 缺措辞而想要的取值登记在本文件末尾 `deferred:` 段。
schema_version: "1.0"
set_id: v1.0-instances
base_set_id: v1.0-smoke
base_params: genetask/params/v1.0-smoke40.yaml
#: 固定种子。本表的排布**不用随机数**（轮换是确定性的下标运算），
#: seed 只作为「这一版排布」的身份记号进指纹以外的元数据，换 seed 不改任何实例。
seed: 20260910
as_of: '2026-07-31'

target:
  per_stage_min: 15
  per_stage_max: 18
  total_about: 130

# --------------------------------------------------------------- 维度定义
#
# `declared_field`：该维度在这个阶段**落进 declared** 的字段名（落进去就要 phrasebook 措辞）。
#                   阶段不在表里 = 该维度只改任务级字段（window / universe 是固定槽，
#                   措辞由 `render.FIXED_PHRASES` 机器生成，不查 phrasebook）。
axes:
  window:
    writes: [row.window, 'inputs[].max_date']
    declared_field: {}          # 任何阶段都不落 declared —— 它是固定槽 task_window
    needs_phrasebook: false
    note: 'inputs[].max_date 一律跟到 window.end（出集 40 行现状就是这个恒等式，逐行核过）'
  universe:
    writes: [row.universe, 'declared.universe / declared.universe_ref', 'inputs[].origin']
    declared_field: {S1: universe, S2: universe_ref, S5: universe_ref}
    needs_phrasebook: true
    note: 'S3/S4/S6/S7/S8 的 universe 只是固定槽 task_universe，不进 declared'
  factor_pool:
    writes: ['gold_args.factor_id', 'inputs[].origin']
    declared_field: {S5: input_factors}
    needs_phrasebook: true
    note: 'S4 的因子只走 gold_args 与夹具 origin，题面 <<fixed:inputs>> 只给路径与 max_date（packager._inputs_phrase 刻意不给 origin）—— 所以换因子**题面逐字不变、夹具变**'

# --------------------------------------------------------------- 逐阶段候选取值
#
# 这些是**变体**取值；每个模板的「基准实例」用它自己那一行的原值，不在这里列。
# 轮换时若某个候选恰好等于该模板的基准值，生成器按列表顺序顺延到下一个（规则写死并配测试）。
values:
  window:
    # A1：window.end ≤ as_of=2026-07-31；A1 还要求 inputs[].max_date ≤ as_of。
    S1: # 取数台账：短窗
      - {start: '2026-07-01', end: '2026-07-31'}
      - {start: '2026-07-20', end: '2026-07-31'}
      - {start: '2026-07-06', end: '2026-07-17'}
      - {start: '2026-06-01', end: '2026-06-30'}
    S2: # 面板对齐：要有历史
      - {start: '2026-01-05', end: '2026-07-31'}
      - {start: '2026-04-01', end: '2026-06-30'}
      - {start: '2025-07-01', end: '2026-07-31'}
      - {start: '2026-07-01', end: '2026-07-31'}
    S3: # 因子求值：lookback 最长 24，窗口不得短于两个月，否则暖机把整窗吃光
      - {start: '2026-01-05', end: '2026-07-31'}
      - {start: '2026-01-05', end: '2026-03-31'}
      - {start: '2026-04-01', end: '2026-07-31'}
      - {start: '2025-07-01', end: '2026-06-30'}
    S4: # IC：holding_periods 最长 20，window.end 必须留出 20 个交易日到 as_of ⇒ end ≤ 2026-06-30
      - {start: '2026-01-05', end: '2026-06-30'}
      - {start: '2026-01-05', end: '2026-03-31'}
      - {start: '2026-04-01', end: '2026-06-30'}
      - {start: '2025-07-01', end: '2026-06-30'}
    S5:
      - {start: '2026-07-01', end: '2026-07-31'}
      - {start: '2026-06-01', end: '2026-06-30'}
      - {start: '2026-05-06', end: '2026-07-31'}
      - {start: '2026-01-05', end: '2026-07-31'}
    S6: # 输入信号夹具由 S5 oracle 在「本集消费方窗口并集」上放宽跑出来，四个候选都落在 2026 年内
      - {start: '2026-07-01', end: '2026-07-31'}
      - {start: '2026-06-01', end: '2026-07-31'}
      - {start: '2026-05-06', end: '2026-07-31'}
      - {start: '2026-04-01', end: '2026-06-30'}
    S7: # 冻结 ε 面板 s7_panel_v3 覆盖 2019-01-02 … 2026-07-03，候选一律是它的子窗
      - {start: '2019-01-02', end: '2026-07-03'}
      - {start: '2022-01-04', end: '2026-07-03'}
      - {start: '2024-01-02', end: '2026-07-03'}
      - {start: '2019-01-02', end: '2023-12-29'}
    S8:
      - {start: '2026-07-01', end: '2026-07-31'}
      - {start: '2026-07-01', end: '2026-07-15'}
      - {start: '2026-06-15', end: '2026-07-15'}
      - {start: '2026-06-01', end: '2026-06-30'}
  universe:
    # phrasebook 现有：universe[csi300|csi500]、universe_ref[csi300@2026-07-31|csi500@2026-07-31]。
    # csi1000 三处都缺措辞 —— 见 deferred。
    S1: [csi300, csi500]
    S2: [csi300, csi500]
    S3: [csi300, csi500]
    S4: [csi300, csi500]
    S5: [csi300, csi500]
    # S6/S7/S8 不适用：S6 的输入信号与 S7 的 ε 面板都是 csi300 绑定的冻结夹具，
    # 换宇宙等于换一份标定；S8 的撮合面板同理。
  factor_pool:
    # 只对「因子经 gold_args + 夹具 origin 进来」的阶段适用。
    # 三条都在 snapshots/v1/gold_factors/{csi300,csi500}/ 下实测存在。
    S4: [gtja_191.001, gtja_191.017, worldquant_101.006]
    # S5 不适用：input_factors 落进 declared，而 phrasebook 只有
    # 'gtja_191.001' 与 'gtja_191.001,gtja_191.002,gtja_191.003' 两个键；
    # 换单因子（如 gtja_191.002）会缺措辞 —— 见 deferred。

# --------------------------------------------------------------- 轮换排布
rotation:
  #: 每个基点出几个实例（**含基准实例自己**）。
  instances_per_base: 3
  #: 适用维度 ≥ 2 的阶段再补几个（落在按 base_task_id 排序的前 N 个基点上）。
  extra:
    when_axes_at_least: 2
    n_bases: 2
    n_extra_each: 1
  #: 组合枚举：适用维度的**笛卡尔积**（窗口 × 宇宙 × 因子池），
  #: 按各维度取值下标的字典序排定，再从下标 (基点在本阶段内的序号) 处开始取。
  #: 与基准值相同的维度在指纹里被剔除（"不含默认值"）；整组都等于基准的组合被丢弃。
  order: 'cartesian, diagonal order = (max(下标), sum(下标), 下标元组) —— 字典序会让第一个维度永远取 0 号值（= 基点现值）而被剔除'
  offset: 'index of base_task_id within its stage (sorted)'

# --------------------------------------------------------------- 基点（= 出集参数表的 40 行）
