# 双臂措辞表：字段 → 取值键 → {strict, open}
# 纪律（2026-09-02 退回后定死）：strict = 记号 + 括注，括注内容与 open 的自然语言**同义同量**；
# open 不带 strict 没有的义务或解释；情态/量词（最多/至少/恰好/一律/只能/必须/可以/仅）两臂要么都有要么都没有。
# 欠定字段的全部取值措辞会被 E2 拿去扫两臂（零命中），所以措辞要有辨识度、不要用泛词。

calendar_id:
  SSE:
    strict: calendar_id=SSE（交易日按上海证券交易所日历，接口值 SSE）
    open: 交易日按上海证券交易所日历，接口值 SSE
