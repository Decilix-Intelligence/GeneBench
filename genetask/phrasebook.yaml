    strict: 'operator_semantics={ts_rank: pct_0_1}（ts_rank 取 (0,1] 的百分位秩）'
    open: ts_rank 取 (0,1] 的百分位秩
  '{"correlation":"pearson_rolling_window"}':
    strict: 'operator_semantics={correlation: pearson_rolling_window}（correlation 是两条序列在滚动窗口内的 Pearson 相关系数）'
    open: correlation 是两条序列在滚动窗口内的 Pearson 相关系数
  '{"power":"elementwise_pow_no_clip"}':
    strict: 'operator_semantics={power: elementwise_pow_no_clip}（幂运算逐元素原样计算，结果不截断、不夹逼）'
    open: 幂运算逐元素原样计算，结果不截断、不夹逼
  '{"dialect":"qlib_expression"}':
    strict: 'operator_semantics={dialect: qlib_expression}（全部算子按 qlib 表达式引擎的语义解释）'
    open: 全部算子按 qlib 表达式引擎的语义解释
  '{"rank":"cs_pct_0_1","sum":"rolling_sum_n"}':
    strict: 'operator_semantics={rank: cs_pct_0_1, sum: rolling_sum_n}（RANK 是同一截面内的百分位秩（取值落在 (0,1]），SUM 是滚动 n 日求和）'
    open: RANK 是同一截面内的百分位秩（取值落在 (0,1]），SUM 是滚动 n 日求和
  '{"mean":"simple_rolling_mean_n"}':
    strict: 'operator_semantics={mean: simple_rolling_mean_n}（MEAN 是滚动 n 日的简单算术平均）'
    open: MEAN 是滚动 n 日的简单算术平均
