      都已不再列 deepseek-chat**（2026-09-06 复核），而 M6/M6b 的响应体说上游实际服务的是
      deepseek-v4-flash —— 所以按别名指过去，不另抄一份数字。
      注册表该不该改写成实际 id 是另一件事（登记在 ops/tickets_inbox/1.5.md，不在本卡改）。

  - model: deepseek-v4-pro
