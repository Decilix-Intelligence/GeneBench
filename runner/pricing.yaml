# GeneBench 价目表（卡 1.5，2026-09-06）—— 主表 `$` 列的唯一价源。
#
# **为什么价要钉进仓库**：`$` 是主表列之一。价目从网页现查，同一份 run 记录在两个月后
# 结算出的 `$` 会不一样，而表上看不出是价变了还是模型变了。钉在这里 + 带 `source_url`
# / `retrieved_at`，「这个数是怎么来的」就有出处。
#
# **口径三条**：
# 1. 单位一律 **每 1M token 的美元数**（`*_per_mtok`），与各家定价页的单位一致；
# 2. **价字段为 null = 缺价**，`pricing.cost_usd` 对它返回 `None`，**不是 0** ——
#    0 会进均值与排名，把「没接这家」读成「这家不要钱」；
# 3. DeepSeek 从 2026-08-16 16:00 UTC 起分**高峰 / 低谷**两档（低谷是高峰的一半）。
#    边车的 `llm_log.jsonl` 不记这次调用落在哪一档，因此本表的 `*_per_mtok`
#    **一律取高峰价（上界）**，低谷价另列 `offpeak_*` 只作参考。
#    主表的 `$` 因此是**成本上界**，不是账单实数 —— 表下要写这句话。
#    （按调用时刻逐条判高峰/低谷 = v1.1，见 ops/tickets_inbox/1.5.md。）
#
# `alias_of`: 该行的空价字段从目标行继承（`pricing.load()` 解析）。用来把
# 「注册表写的 model id」与「上游实际服务的 model id」连起来而不抄第二份数字。
schema_version: 1
prices:

  # —— DeepSeek（v1.0 唯一接入的一家）——————————————————————————————
  - model: deepseek-v4-flash
    provider: deepseek
    base_url_host: api.deepseek.com
    input_per_mtok: 0.44                 # 高峰 · cache miss
    output_per_mtok: 1.32                # 高峰
    cache_hit_input_per_mtok: 0.014      # 高峰 · cache hit
    offpeak_input_per_mtok: 0.22
    offpeak_output_per_mtok: 0.66
    offpeak_cache_hit_input_per_mtok: 0.007
    peak_window_utc: "周一至周五 01:00-04:00 与 06:00-10:00 UTC 为高峰，其余为低谷"
    currency: USD
    effective_date: "2026-08-16"
    source_url: https://api-docs.deepseek.com/quick_start/pricing
    retrieved_at: "2026-09-06"
    note: >-
      M6/M6b 两批 run 的**网络侧真值**：1196 条响应体的 `model` 字段全是 deepseek-v4-flash
      （证据 ops/reports/m6_all/served_model_evidence.json）。

  - model: deepseek-chat
    provider: deepseek
    base_url_host: api.deepseek.com
    alias_of: deepseek-v4-flash
    input_per_mtok: null
