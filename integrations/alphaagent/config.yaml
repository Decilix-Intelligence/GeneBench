# AlphaAgent 的被测配置。
#
# 三条判据（`runner/registry.py` 在 import 期核）：
#   ① base_url 必须 https；② api_key_env 以 _API_KEY 结尾；
#   ③ host 不在 MARKET_DATA_HOSTS 里（行情/新闻源域名一律不得入表 —— 红线 5）。
config_id: cfg-alphaagent-deepseek
harness: alphaagent
model: deepseek-chat
base_url: https://api.deepseek.com
api_key_env: DEEPSEEK_API_KEY
note: AlphaAgent 的 DSL 因子实现循环（run_trajectory 原生工具调用），模型经边车
enabled: true
